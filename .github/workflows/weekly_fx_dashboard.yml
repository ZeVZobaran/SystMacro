name: Weekly FX dashboard update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write

concurrency:
  group: weekly-fx-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Refresh data and models
        run: python -m systmacro.pipeline --refresh
      - name: Audit source coverage
        run: python scripts/audit_bis_coverage.py
      - name: Run tests
        run: python -m pytest
      - name: Commit refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/raw/download_metadata.json
          git diff --cached --quiet || git commit -m "data: weekly FX factor refresh"
          git push
