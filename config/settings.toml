[project]
name = "SystMacro FX Factor Dashboard"
base_currency = "USD"
analysis_numeraire = "equal_weight_currency_basket"
start_date = "1995-01"

[data]
xru_url = "https://data.bis.org/static/bulk/WS_XRU_csv_flat.zip"
eer_url = "https://data.bis.org/static/bulk/WS_EER_csv_flat.zip"
policy_url = "https://data.bis.org/static/bulk/WS_CBPOL_csv_flat.zip"
raw_dir = "data/raw"
processed_dir = "data/processed"
max_monthly_staleness_days = 75

[factors]
momentum_months = 3
value_lookback_months = 60
value_smoothing_months = 6
leg_fraction = 0.3333333333
minimum_currencies = 6

[loadings]
rolling_window_months = 60
minimum_observations = 48
hac_lags = 3

[forecast]
horizon_months = 12
max_ar_order = 2
max_ma_order = 2
minimum_observations = 60

