[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systmacro"
version = "0.1.0"
description = "Systematic macro FX factor pipeline and dashboard"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "requests>=2.32,<3",
  "statsmodels>=0.14,<1",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
systmacro-update = "systmacro.pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
